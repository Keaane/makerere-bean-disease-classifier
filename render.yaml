# Render Blueprint — https://render.com/docs/blueprint-spec
#
# TensorFlow needs real RAM. Free/Starter (512 MB) will OOM.
# Use at least Standard (2 GB). Pro (4 GB) is better for Locust demos.
services:
  - type: web
    name: bean-disease-classifier
    runtime: docker
    plan: standard
    healthCheckPath: /status
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: TF_NUM_INTRAOP_THREADS
        value: "2"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
    # Persist uploads + retrained models across deploys (optional but useful).
    disk:
      name: bean-persistent
      mountPath: /var/data
      sizeGB: 2
