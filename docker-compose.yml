services:
  api:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    # No host ports: traffic goes through nginx only.
    expose:
      - "8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
